[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned rather than floating: both token designs reason about OpenZeppelin v5.6.1
# semantics -- _update is the only virtual hook on the transfer path -- and a moving
# compiler under a pinned dependency defeats the point of pinning the dependency.
solc = "0.8.30"

# Cancun gives us transient storage (EIP-1153) for the asset leg's _forcing flag.
# Besu supports it from 24.x.
evm_version = "cancun"

# Invariants: a fast default for every `forge test`, a deep profile for when it matters.
# `FOUNDRY_PROFILE=deep forge test --match-contract SystemInvariants` runs 128,000 calls
# per invariant, which is where the numbers in test/Invariants.t.sol were checked.
[invariant]
runs = 32
depth = 128

[profile.ci]
verbosity = 3

[profile.deep.invariant]
runs = 256
depth = 500

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
