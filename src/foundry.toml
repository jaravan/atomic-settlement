[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned, not floating. Both token designs depend on OpenZeppelin v5.6.1 semantics
# (_update is the only virtual hook on the transfer path), and there's not much point
# pinning the dependency if the compiler underneath it can move.
solc = "0.8.30"

# London is the oldest target the code needs (CHAINID is Istanbul, nothing later is
# used) and the newest fork the besu-sandbox chart's genesis can enable. Anything newer
# emits PUSH0 (Shanghai) and won't run on that chart, for a gas saving nobody would notice.
evm_version = "london"

# Invariants: a quick default so every `forge test` stays fast, and a deep profile.
# `FOUNDRY_PROFILE=deep forge test --match-contract SystemInvariants` runs 128,000 calls
# per invariant; that's the setting the numbers in test/Invariants.t.sol were checked at.
[invariant]
runs = 32
depth = 128

[profile.ci]
verbosity = 3

[profile.deep.invariant]
runs = 256
depth = 500

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
